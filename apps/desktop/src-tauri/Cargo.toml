[package]
name = "glitchtip-onboarding-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
tauri = { version = "=2.11.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = { version = "=2.5.1" }
tauri-plugin-fs = { version = "=2.5.2" }
tauri-plugin-notification = { version = "=2.4.0" }
tauri-plugin-opener = { version = "=2.5.5" }
tauri-plugin-shell = { version = "=2.3.6" }
tauri-plugin-store = { version = "=2.4.4" }
tempfile = "=3.27.0"
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0" }
# The system notification centre (src/notifications.rs) and the inbox's heartbeat (src/heartbeat.rs).
# Tauri already builds these versions.
objc2 = { version = "=0.6.4" }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSProcessInfo", "NSSet", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
block2 = { version = "=0.6.2" }
